<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cloudflare.com">
    <title>Cửa Hàng Trực Tuyến Của Bạn</title>
    <style>

    </style>
</head>
<body>

    <!-- 1. Thanh điều hướng & Logo -->
        <nav class="nav">
            <ul class="nav-list">
                <li class="nav-item">Trang Chủ</li>
                <li class="nav-item">Sản Phẩm</li>
            </ul>
            <ul class="nav-list">
                <li class="nav-item">Tin Tức</li>
                <li class="nav-item">Liên hệ</li>
                <button class="nav-item-2">  giỏ hàng</button>
            </ul>
        </nav>
        <!--from layout-->
        <div>
            <from>
                <div>
                    <label for="van-minh">Tên đăng nhập</label>
                    <input type="text" id="van-minh" name="tai-khoan">
                </div>
            </from>
        </div>
    <!-- 3. Danh sách sản phẩm -->
    <main id="san-pham">
        <h2 class="section-title">Sản Phẩm Nổi Bật</h2>
        
        <div class="product-grid">
            <!-- Sản phẩm 1 -->
            <div class="product-item">
                <img src="https://placeholder.com" alt="Điện thoại thông minh">
                <h3>Điện Thoại Thông Minh </h3>
                <p class="price">15.000.000 đ</p>
                <button class="btn-add">Thêm vào giỏ</button>
            </div>

            <!-- Sản phẩm 2 -->
            <div class="product-item">
                <img src="https://placeholder.com" alt="Tai nghe không dây">
                <h3>Tai Nghe Không Dây Pro</h3>
                <p class="price">2.500.000 đ</p>
                <button class="btn-add">Thêm vào giỏ</button>
            </div>

            <!-- Sản phẩm 3 -->
            <div class="product-item">
                <img src="https://placeholder.com" alt="Đồng hồ thông minh">
                <h3>Đồng Hồ Thể Thao Gen 5</h3>
                <p class="price">4.200.000 đ</p>
                <button class="btn-add">Thêm vào giỏ</button>
            </div>
        </div>
    </main>

    <!-- 4. Chân trang thông tin -->
    <footer>
        <p>copy; 2026 ShopOnline. Tất cả các quyền được bảo lưu.</p>
        <p>Địa chỉ: 123 Đường Nguyễn Huệ, Quận 1, TP. Hồ Chí Minh</p>
    </footer>
    <div class="box"></div>

</body>
</html>
